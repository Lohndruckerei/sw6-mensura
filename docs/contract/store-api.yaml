openapi: 3.1.0
info:
  title: Mensura Store-API
  version: 1.0.0
  description: |
    Vertrag zwischen Mensura-Backend und -Frontend (Konfigurator „kompakt“ und „geführt“, später Produktberater).
    Alle Preise netto für die Kundengruppe des Sales-Channel-Kontexts. Keine Einkaufspreise.
    Aufruf wie jede Shopware-Store-API: Header `sw-access-key`, optional `sw-context-token`.
servers:
  - url: /store-api
paths:
  /ld-mensura/product/{productId}/configurator:
    get:
      summary: Konfigurator-Daten eines Produkts (Materialien, Sets, Gruppen, Werte, Grenzen, Vorbelegung)
      operationId: mensuraConfigurator
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
      responses:
        '200':
          description: Daten zum Aufbau des Konfigurators
          content:
            application/json:
              schema: { $ref: 'schema/configurator.schema.json' }
              examples:
                aluverbund: { externalValue: 'fixtures/configurator/aluverbund.json' }
        '404': { description: 'Produkt hat kein Mensura-Profil', content: { application/json: { schema: { $ref: '#/components/schemas/Errors' } } } }
  /ld-mensura/calculate:
    post:
      summary: Konfiguration prüfen, normalisieren und berechnen
      description: |
        Wird bei jeder Änderung im Konfigurator aufgerufen (entprellt). Ungültige Werte werden durch den Standard ersetzt
        und als Hinweis gemeldet; Formatverletzungen liefern `valid: false` mit `errors[].fix`.
        Mit `matrix: true` zusätzlich Preise für `quantitySteps` × Lieferzeiten (geführte Darstellung). `matrix[].quantity`
        ist der Wert für `perMotif` (Stück je Motiv; bei `motifMode: split` die Gesamtmenge), `total: null` = Lieferzeit
        für diese Menge nicht verfügbar. `delivery` listet jede Lieferzeit mit Termin bzw. Grund (z. B. „nur bis 50 Stück“).
      operationId: mensuraCalculate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: { $ref: 'schema/configuration.schema.json' }
                matrix: { type: boolean, default: false }
      responses:
        '200':
          description: Ergebnis (auch bei ungültiger Konfiguration 200 mit valid=false)
          content:
            application/json:
              schema: { $ref: 'schema/calculation-result.schema.json' }
              examples:
                mindestpreis: { externalValue: 'fixtures/calculate/alu-mindestpreis.expected.json' }
                comdatek353: { externalValue: 'fixtures/calculate/alu-comdatek-353.expected.json' }
                acrylZuHoch: { externalValue: 'fixtures/calculate/acryl-hoehe-zu-gross.expected.json' }
                folieMindestflaeche: { externalValue: 'fixtures/calculate/folie-mindestflaeche.expected.json' }
                folieSchrittweite: { externalValue: 'fixtures/calculate/folie-schrittweite.expected.json' }
        '400': { description: 'Anfrage unvollständig (configuration.productId fehlt/ungültig)', content: { application/json: { schema: { $ref: '#/components/schemas/Errors' } } } }
        '404': { description: 'Produkt hat kein Mensura-Profil', content: { application/json: { schema: { $ref: '#/components/schemas/Errors' } } } }
  /ld-mensura/cart/add:
    post:
      summary: Konfigurierte Position in den Warenkorb (Backend rechnet erneut, nie Frontend-Preise übernehmen)
      description: |
        Legt eine eigene Produktposition an (jede Konfiguration getrennt, Menge = Gesamtmenge der Konfiguration).
        Bei jeder Warenkorbberechnung rechnet das Backend neu; eine Mengenänderung im Warenkorb wird auf die
        Konfiguration zurückgesetzt (Menge nur im Konfigurator ändern). Wird eine Position ungültig, entfernt das
        Backend sie mit dem Warenkorb-Fehler `ld-mensura-configuration-invalid` (Parameter `name`, `reason`).
        Payload der Position: `ldMensura` laut docs/INTEGRATION.md Abschnitt 1 (mit `configuration`) und `ldDeliveryDate`.
      operationId: mensuraCartAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: { $ref: 'schema/configuration.schema.json' }
      responses:
        '200': { description: Warenkorb (Shopware-Standardantwort) }
        '400':
          description: Konfiguration ungültig (Antwort wie calculate mit valid=false) bzw. Anfrage unvollständig (Errors)
          content:
            application/json:
              schema: { oneOf: [{ $ref: 'schema/calculation-result.schema.json' }, { $ref: '#/components/schemas/Errors' }] }
        '404': { description: 'Produkt hat kein Mensura-Profil', content: { application/json: { schema: { $ref: '#/components/schemas/Errors' } } } }
  /ld-mensura/preset/validate:
    post:
      summary: Vorlage (z. B. vom Produktberater) prüfen und in eine gültige Konfiguration überführen
      operationId: mensuraPresetValidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: { $ref: 'schema/configuration.schema.json' }
      responses:
        '200':
          description: wie calculate
          content:
            application/json:
              schema: { $ref: 'schema/calculation-result.schema.json' }
        '404': { description: 'Produkt hat kein Mensura-Profil', content: { application/json: { schema: { $ref: '#/components/schemas/Errors' } } } }
components:
  schemas:
    Errors:
      description: Fehlerantwort wie bei Shopware (nur 400/404; Konfigurationsfehler kommen als 200 mit valid=false)
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            properties: { status: { type: string }, code: { type: string }, detail: { type: string } }
