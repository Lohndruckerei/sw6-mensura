<!doctype html>
<html lang="de-DE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensura Konfigurator – Testseite</title>
  <!-- Bootstrap steht hier für das Shopware-Theme (im Shop kommt alles aus dem Theme) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/src/Resources/app/storefront/src/scss/base.scss">
  <style>
    .lm-testbar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
    .lm-fake-gallery { aspect-ratio: 4 / 3; background: var(--bs-tertiary-bg); border-radius: var(--bs-border-radius); display: grid; place-items: center; color: var(--bs-secondary-color); }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="lm-testbar mb-3">
      <strong>Mensura · Testseite (Fixtures, ohne Shop)</strong>
      <span class="text-body-secondary small">Preise nur für die Beispielfälle aus docs/contract/fixtures/calculate – sonst „kein Preis“.</span>
      <span class="ms-auto btn-group btn-group-sm" role="group" aria-label="Testeinstellungen">
        <a class="btn btn-outline-secondary" href="?place=buybox">Kaufbox</a>
        <a class="btn btn-outline-secondary" href="?place=wide">volle Breite</a>
        <a class="btn btn-outline-secondary" href="?lang=en-GB">English</a>
        <a class="btn btn-outline-secondary" href="?lang=de-DE">Deutsch</a>
      </span>
    </div>
    <div class="small mb-3">Beispielfälle zum Anklicken:
      <a href="#lm?m=alu-3mm&w=600&h=400&mo=1&pm=1&o.farbigkeit=4-0&o.veredelung=keine&o.bohrung=nein&o.schnitt=recht&d=standard" data-reload>Mindestpreis 12,50 €</a> ·
      <a href="#lm?m=alu-3mm&w=1000&h=500&mo=1&pm=10&o.farbigkeit=4-4&o.veredelung=ag-2&o.bohrung=ja&o.schnitt=kontur&d=standard" data-reload>Comdatek 353,00 €</a> ·
      <a href="#lm?m=alu-3mm&w=1500&h=3000&mo=1&pm=1&o.farbigkeit=4-0&o.veredelung=keine&o.bohrung=nein&o.schnitt=recht&d=standard" data-reload>Großformat 131,00 €</a> ·
      <a href="#lm?m=alu-3mm&w=1200&h=2500&mo=1&pm=1&o.farbigkeit=4-4&o.veredelung=lam-matt&o.bohrung=ja&o.schnitt=recht&d=standard" data-reload>1.200 × 2.500 (dann Acryl wählen)</a>
    </div>
    <div id="place"></div>
  </div>
  <script type="module">
    import { mountConfigurator } from '/src/Resources/app/storefront/src/ld-mensura-configurator/mount.js';
    import { flattenSnippets } from '/src/Resources/app/storefront/src/ld-mensura-configurator/util.js';

    const q = new URLSearchParams(location.search);
    const lang = q.get('lang') === 'en-GB' ? 'en-GB' : 'de-DE';
    document.documentElement.lang = lang;
    const place = document.getElementById('place');
    place.innerHTML = q.get('place') === 'wide'
      ? '<div class="lm-host" id="cfg"></div>'
      : '<div class="row g-4"><div class="col-lg-5"><div class="lm-fake-gallery">Produktbild</div></div><div class="col-lg-7"><h1 class="h3">Aluverbund-Schilder</h1><div class="lm-host" id="cfg"></div></div></div>';

    const texts = flattenSnippets(await (await fetch(`/src/Resources/snippet/storefront.${lang}.json`)).json(), 'ldMensura.configurator');
    document.querySelectorAll('[data-reload]').forEach((a) => a.addEventListener('click', () => setTimeout(() => location.reload(), 0)));
    const el = document.getElementById('cfg');
    if (q.get('api')) {
      // echte Store-API des lokalen Shops: ?api=http://localhost/store-api&key=<sw-access-key>&product=<id>
      window.lm = await mountConfigurator(el, { storeApiUrl: q.get('api'), accessKey: q.get('key'), productId: q.get('product') || '0194e1a0000070008000000000000a01', texts, locale: lang, currency: 'EUR' });
    } else {
      const base = '/docs/contract/fixtures';
      const fixtureIndex = await (await fetch(`${base}/index.json`)).json();
      window.lm = await mountConfigurator(el, { fixtures: base, fixtureIndex, texts, locale: lang, currency: 'EUR' });
    }
  </script>
</body>
</html>
